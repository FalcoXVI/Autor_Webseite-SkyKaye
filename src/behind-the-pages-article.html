<script>
(function () {
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var nodes = [].slice.call(document.querySelectorAll('[data-reveal]'));
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.remove('pre');
      e.target.classList.add('in');
      io.unobserve(e.target);
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
  nodes.forEach(function (n) {
    if (n.getBoundingClientRect().top < window.innerHeight * 0.9) return;
    n.classList.add('pre');
    io.observe(n);
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>

<script>
/* Shows the entry addressed by ?id=… — or a clear message when the link is
   invalid, the entry was removed, or the entries could not be loaded. */
(function () {
  var titleEl = document.querySelector('[data-article="title"]');
  var metaEl = document.querySelector('[data-article="meta"]');
  var bodyEl = document.querySelector('[data-article="body"]');

  function setMeta(selector, content) {
    var el = document.querySelector(selector);
    if (el) el.setAttribute('content', content);
  }

  function showMessage(title, html) {
    titleEl.textContent = title;
    metaEl.style.display = 'none';
    bodyEl.innerHTML = html;
    document.title = title + ' — Sky Kaye';
    var robots = document.createElement('meta');
    robots.name = 'robots';
    robots.content = 'noindex';
    document.head.appendChild(robots);
  }

  function show(entry) {
    var esc = SkyRichText.escape;
    titleEl.textContent = entry.title;
    metaEl.innerHTML = '<span style="font-family:ui-monospace,Menlo,monospace;font-size:13px">' + esc(SkyFeed.formatDate(entry.date)) + '</span>' +
      '<span>Reading Time ' + SkyArticles.minutesLabel(entry.readingTime) + '</span>';
    bodyEl.innerHTML = SkyRichText.render(entry.body);
    var pageTitle = entry.title + ' — Behind The Pages — Sky Kaye';
    var summary = SkyRichText.firstLine(entry.body).slice(0, 160);
    document.title = pageTitle;
    setMeta('meta[property="og:title"]', pageTitle);
    if (summary) {
      setMeta('meta[name="description"]', summary);
      setMeta('meta[property="og:description"]', summary);
    }
  }

  if (!window.SkyArticles) {
    showMessage('Something went wrong', '<p>This entry could not be loaded. Please try again later.</p>');
    return;
  }

  var param = new URLSearchParams(window.location.search).get('id');
  SkyArticles.load()
    .then(function (entries) {
      var entry = SkyArticles.find(entries, param);
      if (entry) show(entry);
      else showMessage('Page not found', '<p>This entry doesn&rsquo;t exist (anymore) — the link may be incomplete, or the entry was removed.</p>' +
        '<p>All entries are listed on the <a href="behind-the-pages.html">Behind the pages overview</a>.</p>');
    })
    .catch(function () {
      showMessage('Something went wrong', '<p>This entry could not be loaded. Please check your connection and reload the page.</p>');
    });
})();
</script>
